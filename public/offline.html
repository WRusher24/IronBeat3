<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EC" />
    <title>IronBeat — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(110% 70% at 50% 0%, rgba(212, 163, 115, 0.22), transparent 65%),
          #f5f2ec;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 430px;
        border: 1px solid rgba(28, 28, 30, 0.1);
        border-radius: 28px;
        background: rgba(255, 253, 248, 0.9);
        padding: 32px 26px;
        box-shadow: 0 30px 80px -50px rgba(28, 28, 30, 0.6);
      }
      .mark {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 40px;
        margin-bottom: 26px;
      }
      .mark span {
        display: block;
        width: 6px;
        border-radius: 999px;
        background: #d4a373;
      }
      .mark span:nth-child(1) { height: 16px; }
      .mark span:nth-child(2) { height: 34px; }
      .mark span:nth-child(3) { height: 24px; }
      .mark span:nth-child(4) { height: 10px; }
      p.label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6f6a61;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 38px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      h1 em {
        color: #b9854f;
      }
      p.copy {
        margin: 16px 0 24px;
        font-size: 14px;
        line-height: 1.65;
        color: #6f6a61;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 48px;
        border-radius: 999px;
        background: #1c1c1e;
        color: #f7f3ec;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="label">Connection lost</p>
      <h1>You're <em>offline.</em></h1>
      <p class="copy">
        IronBeat could not reach the network. Your current track may keep
        playing, but new searches and streams need a connection. Reconnect and
        get back under the bar.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
